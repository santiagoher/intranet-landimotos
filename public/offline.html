<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <title>Sin conexión · Landimotos</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #171717; color: #fff; font-family: Arial, sans-serif; }
      main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #404040; border-radius: 24px; background: #262626; }
      .brand { color: #93c5fd; font-weight: 700; }
      h1 { font-size: 28px; }
      p { color: #d4d4d4; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 12px; background: #2563eb; color: white; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Landimotos</div>
      <h1>No hay conexión</h1>
      <p>No pudimos conectar con la intranet. Revisa tu conexión a internet y vuelve a intentarlo.</p>
      <p>Necesitas conexión para consultar información y guardar cambios.</p>
      <a href="/">Volver a intentar</a>
    </main>
  </body>
</html>
