<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        if (localStorage.getItem('landimotos-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name="theme-color"]').content = '#0e0f11';
        }
      } catch {}
    </script>
    <title>Sin conexión · Landimotos</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: light; --bg: #fff; --text: #18181b; --surface: #f8f9fa; --border: #e9eaec; --muted: #71717a; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #0e0f11; --text: #f5f5f5; --surface: #1d1f23; --border: #2b2d31; --muted: #a1a1aa; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; }
      main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
      .brand { font-weight: 600; }
      h1 { font-size: 28px; }
      p { color: var(--muted); line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 8px; background: #1769ff; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Landimotos</div>
      <h1>No hay conexión</h1>
      <p>No pudimos conectar con la intranet. Revisa tu conexión a internet y vuelve a intentarlo.</p>
      <p>Necesitas conexión para consultar información y guardar cambios.</p>
      <a href="/">Volver a intentar</a>
    </main>
  </body>
</html>
